<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101820">
<title>Y Analyzer · Computador</title>
<style>
:root{color-scheme:dark;--bg:#0b1117;--panel:#141e28;--panel2:#1b2935;--line:#344554;--text:#edf3f7;--muted:#9aabb8;--gold:#e4b85d;--green:#16875b;--red:#b93236}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px system-ui,Segoe UI,sans-serif}
#toolbar{position:fixed;z-index:5;left:0;right:0;top:0;height:54px;display:flex;align-items:center;gap:7px;padding:8px 12px 8px 350px;background:#121c26;border-bottom:1px solid var(--line)}#toolbar button{padding:7px 11px;min-width:36px}#address{flex:1;min-width:80px;height:36px;border:1px solid var(--line);border-radius:9px;background:#080f16;color:var(--text);padding:0 12px;font:14px system-ui;outline:none}#address:focus{border-color:var(--gold)}#go{background:var(--gold);color:#211a0c;border-color:var(--gold)}#browser{position:fixed;inset:54px 0 0;background:#080c10}#roulette{width:100%;height:100%;border:0;background:#080c10}@media(max-width:700px){#toolbar{padding-left:8px}#panel{top:62px}}
#panel{position:fixed;z-index:10;left:18px;top:18px;width:310px;max-height:calc(100vh - 36px);display:flex;flex-direction:column;background:#111a23f5;border:1px solid #566574;border-radius:14px;box-shadow:0 12px 40px #0009;backdrop-filter:blur(12px);overflow:hidden;resize:both;min-width:270px;min-height:180px}
#drag{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;background:#202c37;border-bottom:1px solid var(--line);cursor:move;user-select:none}
#drag strong{letter-spacing:.08em}#drag small{color:var(--muted)}.headActions{display:flex;gap:5px}.headActions button{padding:4px 8px}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:700;cursor:pointer}
button:hover{border-color:var(--gold)}button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#content{padding:11px;overflow:auto}.last{display:flex;align-items:center;gap:12px;padding:9px 10px;margin-bottom:10px;border:1px solid var(--line);border-radius:11px;background:#0c141c}
.last label{font-size:10px;letter-spacing:.08em;color:var(--muted);font-weight:800}.last b{display:grid;place-items:center;width:48px;height:48px;border-radius:9px;background:#26323d;font-size:28px}
#chosen{font-size:12px;color:var(--muted);margin:0 0 8px}.numbers{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.num{padding:8px 2px;min-height:37px;border-radius:7px;font-size:14px}.num.green{background:var(--green)}.num.red{background:var(--red)}.num.black{background:#26323d}.num.active{outline:3px solid var(--gold);outline-offset:1px;color:#fff}
.actions{display:flex;gap:7px;margin-top:9px}.actions button{flex:1}.primary{background:var(--gold);color:#211a0c;border-color:var(--gold)}
.section{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.section h3{font-size:12px;margin:0 0 8px;color:#f0d18b}
#strategy{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.cell{background:#0c141c;border:1px solid var(--line);border-radius:8px;text-align:center;padding:7px 3px}.cell small{display:block;color:var(--muted);font-size:10px}.cell b{font-size:18px}
#history{font-size:12px;color:var(--muted);line-height:1.7;max-height:70px;overflow:auto;overflow-wrap:anywhere}
#minimized{display:none;position:fixed;z-index:11;left:18px;top:18px}
#panel.closed #content{display:none}#panel.closed{width:auto;min-height:0;resize:none}
@media(max-width:700px){#panel{left:8px;top:8px;width:280px;max-height:calc(100vh - 16px)}#content{padding:8px}.num{min-height:32px;padding:6px 2px}}
</style>
</head>
<body>
<nav id="toolbar" aria-label="Barra do navegador"><button id="back" title="Voltar">←</button><button id="forward" title="Avançar">→</button><button id="reload" title="Recarregar">⟳</button><input id="address" type="text" placeholder="Pesquisar ou digitar endereço" autocomplete="off" spellcheck="false" aria-label="Pesquisar ou digitar endereço"><button id="go">Ir</button></nav>
<div id="browser"><iframe id="roulette" title="Página do navegador" src="about:blank" allow="fullscreen; autoplay"></iframe></div>
<section id="panel" aria-label="Painel flutuante Y Analyzer">
 <header id="drag"><div><strong>Y ANALYZER</strong><br><small>Painel flutuante · arraste para mover</small></div><div class="headActions"><button id="collapse" title="Minimizar painel">−</button></div></header>
 <div id="content">
  <div class="last"><div><label>ÚLTIMO RESULTADO</label><div id="lastInfo" style="font-size:11px;color:var(--muted)">Nenhum registrado</div></div><b id="lastNumber">—</b></div>
  <p id="chosen">Escolha um número de 0 a 36.</p>
  <div class="numbers" id="numbers" aria-label="Todos os números da roleta"></div>
  <div class="actions"><button class="primary" id="record">Registrar resultado</button><button id="clear">Limpar seleção</button></div>
  <div class="section"><h3>ESTRATÉGIA · QUATRO Y</h3><div id="strategy"><div class="cell"><small>Base</small><b>—</b></div></div><p style="font-size:10px;color:var(--muted);margin:8px 0 0">A seleção de 1 a 36 calcula as oito pontas. O zero pode ser registrado como resultado, mas não é número-base.</p></div>
  <div class="section"><h3>HISTÓRICO RECENTE</h3><div id="history">Ainda sem resultados.</div></div>
 </div>
</section>
<button id="minimized">Y Analyzer · Abrir painel</button>
<script>
const wheel=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const offsets=[0,5,9,14,19,23,28,32],labels=['+1','X1','+2','X2','+3','X3','+4','X4'];
const reds=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
let selected=null,history=JSON.parse(localStorage.getItem('ya-desktop-history')||'[]');
const $=id=>document.getElementById(id);
function color(n){return n===0?'green':reds.has(n)?'red':'black'}
function drawNumbers(){const root=$('numbers');root.innerHTML='';for(let n=0;n<=36;n++){const b=document.createElement('button');b.className='num '+color(n)+(selected===n?' active':'');b.textContent=n;b.onclick=()=>selectNumber(n);root.appendChild(b)}}
function selectNumber(n){selected=n;$('chosen').textContent='Selecionado: '+n+(n===0?' · zero não é base da estratégia':' · pode ser registrado e usado como base');drawNumbers();drawStrategy()}
function drawStrategy(){const root=$('strategy');root.innerHTML='';if(selected===null||selected===0){root.innerHTML='<div class="cell" style="grid-column:1/-1"><small>Escolha uma base de 1 a 36</small><b>—</b></div>';return}const base=wheel.indexOf(selected);offsets.forEach((off,i)=>{const n=wheel[(base+off)%wheel.length],d=document.createElement('div');d.className='cell';d.innerHTML='<small>'+labels[i]+'</small><b>'+n+'</b>';root.appendChild(d)})}
function renderHistory(){if(!history.length){$('history').textContent='Ainda sem resultados.';return}$('history').textContent=history.slice(0,12).join(' · ')}
function record(){if(selected===null){$('chosen').textContent='Selecione primeiro um número de 0 a 36.';return}history.unshift(selected);history=history.slice(0,100);localStorage.setItem('ya-desktop-history',JSON.stringify(history));$('lastNumber').textContent=selected;$('lastNumber').style.background=selected===0?'var(--green)':reds.has(selected)?'var(--red)':'#26323d';$('lastInfo').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});renderHistory();$('chosen').textContent='Resultado '+selected+' registrado no histórico.'}
$('record').onclick=record;$('clear').onclick=()=>{selected=null;$('chosen').textContent='Escolha um número de 0 a 36.';drawNumbers();drawStrategy()};
$('collapse').onclick=()=>{$('panel').classList.add('closed');$('minimized').style.display='block'};$('minimized').onclick=()=>{$('panel').classList.remove('closed');$('minimized').style.display='none'};
const panel=$('panel'),handle=$('drag');let drag=null;handle.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=panel.getBoundingClientRect();drag={x:e.clientX-r.left,y:e.clientY-r.top};handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointermove',e=>{if(!drag)return;panel.style.left=Math.max(0,Math.min(innerWidth-panel.offsetWidth,e.clientX-drag.x))+'px';panel.style.top=Math.max(0,Math.min(innerHeight-60,e.clientY-drag.y))+'px'});handle.addEventListener('pointerup',()=>drag=null);handle.addEventListener('pointercancel',()=>drag=null);

const address=$('address'),frame=$('roulette');
function navigate(){let value=address.value.trim();if(!value)return;let target;if(/^https?:\\/\\//i.test(value))target=value;else if(/^[\\w-]+(\\.[\\w-]+)+([/:?#].*)?$/i.test(value))target='https://'+value;else target='https://www.google.com/search?q='+encodeURIComponent(value);frame.src=target;address.value=target}
$('go').addEventListener('click',navigate);
address.addEventListener('keydown',e=>{if(e.key==='Enter')navigate()});
$('reload').addEventListener('click',()=>{try{frame.contentWindow.location.reload()}catch(e){frame.src=frame.src}});
$('back').addEventListener('click',()=>{try{frame.contentWindow.history.back()}catch(e){}});
$('forward').addEventListener('click',()=>{try{frame.contentWindow.history.forward()}catch(e){}});

drawNumbers();drawStrategy();renderHistory();if(history.length){$('lastNumber').textContent=history[0];$('lastInfo').textContent='Salvo neste computador';$('lastNumber').style.background=history[0]===0?'var(--green)':reds.has(history[0])?'var(--red)':'#26323d'}
</script>
</body>
</html>
